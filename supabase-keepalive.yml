name: Supabase Keep Alive

on:
  schedule:
    # Four runs per day. Each run performs a few lightweight database reads.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Generate user database activity
        env:
          SUPABASE_URL: https://qihajayxjukppcnsrgpi.supabase.co
          SUPABASE_KEY: sb_publishable_NCPEc56HEwlcQroUnCtp2Q_Niz3sNH6
        run: |
          set -euo pipefail

          for ATTEMPT in 1 2 3; do
            HTTP_CODE=$(curl --silent --show-error \
              --output /tmp/supabase-response.txt \
              --write-out "%{http_code}" \
              "$SUPABASE_URL/rest/v1/locked_os_state_v2?select=id,updated_at&id=eq.samuel-main" \
              --header "apikey: $SUPABASE_KEY")

            cat /tmp/supabase-response.txt
            echo
            echo "Supabase keep-alive request $ATTEMPT returned HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              exit 1
            fi

            sleep 5
          done
